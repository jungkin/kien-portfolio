    <line x1="660" y1="230" x2="660" y2="290" stroke-width="1.25"/>
    <path d="M660 290 L605 330 Q630 345 660 340 Q690 345 715 330 Z" fill="#FF4F1F" fill-opacity="0.9"/>
    <path d="M660 290 L632 338 M660 290 L660 340 M660 290 L688 338" stroke-width="0.8"/>
