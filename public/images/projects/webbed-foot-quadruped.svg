  <g stroke-width="0.6" opacity="0.6">
    <line x1="235" y1="260" x2="258" y2="332"/><line x1="258" y1="332" x2="236" y2="388"/><path d="M216 388 H256 L248 398 H224 Z"/>
    <line x1="405" y1="260" x2="382" y2="332"/><line x1="382" y1="332" x2="404" y2="388"/><path d="M386 388 H424 L416 398 H394 Z"/>
