<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" stroke="#15161a" stroke-width="1.25" font-family="IBM Plex Mono, monospace" font-size="10">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#15161a" stroke="none"/></marker>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#15161a" stroke-width="0.6"/></pattern>
  </defs>
  <line x1="50" y1="260" x2="750" y2="260" stroke-dasharray="14 3 2 3" stroke-width="0.8"/>
  <!-- body tube lower, fin can -->
  <line x1="80" y1="190" x2="720" y2="190"/><line x1="80" y1="330" x2="720" y2="330"/>
  <line x1="80" y1="198" x2="720" y2="198" stroke-width="0.6"/><line x1="80" y1="322" x2="720" y2="322" stroke-width="0.6"/>
  <!-- aft end & motor mount -->
  <line x1="720" y1="190" x2="720" y2="330"/>
  <rect x="640" y="236" width="80" height="48" stroke-width="0.9"/>
  <!-- centering rings -->
  <rect x="300" y="198" width="14" height="124" fill="url(#h)"/>
  <rect x="560" y="198" width="14" height="124" fill="url(#h)"/>
  <!-- motor tube -->
  <rect x="300" y="244" width="340" height="32" stroke-width="0.9"/>
  <!-- fin frame (bolted bracket) -->
  <path d="M340 330 L340 372 L560 372 L560 330" />
  <rect x="340" y="330" width="220" height="42" fill="#FF4F1F" fill-opacity="0.35"/>
  <path d="M340 330 H560"/>
  <!-- fin -->
  <path d="M360 372 L330 520 L470 520 L520 372 Z"/>
  <line x1="372" y1="372" x2="344" y2="520" stroke-width="0.4"/>
  <!-- bolts -->
  <g stroke-width="1.25">
    <circle cx="370" cy="351" r="6" fill="#15161a" fill-opacity="0.12"/><line x1="364" y1="351" x2="376" y2="351"/>
    <circle cx="420" cy="351" r="6" fill="#15161a" fill-opacity="0.12"/><line x1="414" y1="351" x2="426" y2="351"/>
    <circle cx="470" cy="351" r="6" fill="#15161a" fill-opacity="0.12"/><line x1="464" y1="351" x2="476" y2="351"/>
    <circle cx="520" cy="351" r="6" fill="#15161a" fill-opacity="0.12"/><line x1="514" y1="351" x2="526" y2="351"/>
  </g>
  <!-- bolt pitch dimension -->
  <line x1="370" y1="380" x2="370" y2="415" stroke-width="0.4"/><line x1="520" y1="380" x2="520" y2="415" stroke-width="0.4"/>
  <line x1="370" y1="410" x2="520" y2="410" stroke-width="0.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="445" y="404" text-anchor="middle" fill="#15161a" stroke="none">4X BOLT PATTERN</text>
  <!-- fin height dim -->
  <line x1="560" y1="372" x2="620" y2="372" stroke-width="0.4"/><line x1="480" y1="520" x2="620" y2="520" stroke-width="0.4"/>
  <line x1="612" y1="372" x2="612" y2="520" stroke-width="0.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="622" y="450" fill="#15161a" stroke="none">FIN SPAN</text>
  <!-- callouts -->
  <polyline points="450,351 450,110 520,110" stroke-width="0.8" stroke-dasharray="0"/>
  <text x="526" y="114" fill="#15161a" stroke="none">BOLTED FIN FRAME</text>
  <polyline points="470,244 470,150 520,150" stroke-width="0.8"/>
  <text x="526" y="154" fill="#15161a" stroke="none">MOTOR TUBE</text>
  <polyline points="307,198 307,150 200,150" stroke-width="0.8"/>
  <text x="90" y="154" fill="#15161a" stroke="none">CENTERING RING</text>
  <g stroke-width="1"><rect x="470" y="535" width="290" height="50"/><line x1="470" y1="558" x2="760" y2="558" stroke-width="0.6"/></g>
  <text x="480" y="551" fill="#15161a" stroke="none">BOLTED FIN FRAME · FIN CAN</text>
  <text x="480" y="574" fill="#15161a" stroke="none" font-size="9">DWG 03 · SCALE NTS · REV A</text>
</svg>
